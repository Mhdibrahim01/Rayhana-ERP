<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول | ريحانة للوحدات السكنية - Rayhana Suites</title>
  
  <!-- Cairo Arabic Web Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            cairo: ['Cairo', 'sans-serif'],
          },
          colors: {
            brand: {
              forest: '#1a4332',
              forestHover: '#143628',
              gold: '#a67c52',
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="styles.css">
  
  <style>
    /* Specific scoped rules for login to guarantee 100% centering and zero screen-width stretching */
    body.login-body {
      min-height: 100vh;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      margin: 0;
      padding: 1.5rem;
      background-color: #f8fafc;
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(236, 253, 245, 0.9) 0%, transparent 45%),
        radial-gradient(circle at 85% 15%, rgba(254, 243, 199, 0.45) 0%, transparent 40%),
        radial-gradient(circle at 50% 85%, rgba(241, 245, 249, 0.95) 0%, transparent 55%),
        linear-gradient(135deg, #ffffff 0%, #f8fafc 50%, #f1f5f9 100%);
      font-family: 'Cairo', system-ui, sans-serif;
      overflow-y: auto !important;
    }
    .login-container-card {
      max-width: 440px !important;
      width: 100% !important;
      margin: 0 auto !important;
      background: rgba(255, 255, 255, 0.75) !important;
      backdrop-filter: blur(24px) saturate(180%) !important;
      -webkit-backdrop-filter: blur(24px) saturate(180%) !important;
      border: 1px solid rgba(255, 255, 255, 0.85) !important;
      border-radius: 1.5rem !important;
      box-shadow: 0 20px 50px -10px rgba(0, 0, 0, 0.06), 0 8px 20px -6px rgba(0, 0, 0, 0.04), inset 0 1px 1px 0 #ffffff !important;
      padding: 2.25rem !important;
      position: relative !important;
      z-index: 10 !important;
    }
  </style>
</head>
<body class="login-body min-h-screen flex items-center justify-center p-4 relative overflow-hidden bg-slate-50 font-cairo">

  <!-- Ambient Dynamic Pastel Orbs (Provides frosted glass light refraction) -->
  <div class="fixed -top-24 -left-20 w-96 h-96 rounded-full bg-emerald-200/35 blur-3xl pointer-events-none -z-0"></div>
  <div class="fixed -bottom-24 -right-20 w-96 h-96 rounded-full bg-amber-100/50 blur-3xl pointer-events-none -z-0"></div>
  <div class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[520px] h-[520px] rounded-full bg-teal-100/25 blur-[100px] pointer-events-none -z-0"></div>

  <!-- Toast Container -->
  <div id="toast-container"></div>

  <!-- Login Card (The Container) -->
  <main class="login-container-card max-w-md w-full p-8 bg-white/75 backdrop-blur-xl border border-white/80 shadow-[0_20px_50px_rgba(0,0,0,0.06),inset_0_1px_1px_rgba(255,255,255,0.95)] rounded-3xl relative z-10 transition-all">
    
    <!-- Logo & Header -->
    <div class="text-center mb-7">
      <div class="inline-flex items-center justify-center p-2 rounded-2xl bg-white/90 border border-slate-200/60 shadow-sm mb-4">
        <img src="assets/rayhana-logo.png" alt="شعار ريحانة للوحدات السكنية" class="w-16 h-16 rounded-xl object-cover shadow-sm">
      </div>
      <h1 class="text-2xl font-black text-slate-800 tracking-tight leading-snug">ريحانة للوحدات السكنية</h1>
      <p class="text-xs font-semibold text-slate-500 mt-1">Rayhana Suites • نظام إدارة الحجوزات الفندقية</p>
    </div>

    <!-- Error Alert Box -->
    <div id="login-error-alert" style="display: none;" class="mb-5 p-3.5 rounded-xl bg-rose-50/90 border border-rose-200/80 text-rose-700 text-xs font-bold flex items-center gap-2">
      <svg class="w-4 h-4 shrink-0 text-rose-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      <span>اسم المستخدم أو كلمة المرور غير صحيحة.</span>
    </div>

    <!-- Login Form -->
    <form id="login-form" autocomplete="off" class="space-y-4">
      
      <!-- Username Field -->
      <div>
        <label for="username" class="block text-xs font-bold text-slate-700 mb-1.5 pr-1">اسم المستخدم</label>
        <div class="relative">
          <input 
            type="text" 
            id="username" 
            name="username" 
            required 
            placeholder="أدخل اسم المستخدم" 
            autocomplete="username" 
            autofocus 
            class="w-full px-4 py-3 rounded-xl bg-white/90 border border-slate-200/90 text-slate-800 text-sm font-semibold placeholder:text-slate-400 focus:outline-none focus:border-[#1a4332] focus:ring-2 focus:ring-[#1a4332]/15 transition-all shadow-sm"
          >
        </div>
      </div>

      <!-- Password Field -->
      <div>
        <label for="password" class="block text-xs font-bold text-slate-700 mb-1.5 pr-1">كلمة المرور</label>
        <div class="relative">
          <input 
            type="password" 
            id="password" 
            name="password" 
            required 
            placeholder="••••••••" 
            autocomplete="current-password" 
            class="w-full px-4 py-3 rounded-xl bg-white/90 border border-slate-200/90 text-slate-800 text-sm font-semibold placeholder:text-slate-400 focus:outline-none focus:border-[#1a4332] focus:ring-2 focus:ring-[#1a4332]/15 transition-all shadow-sm"
          >
        </div>
      </div>

      <!-- Submit Button -->
      <div class="pt-2">
        <button 
          type="submit" 
          id="btn-submit" 
          class="w-full py-3.5 px-4 rounded-xl bg-[#1a4332] hover:bg-[#143628] text-white text-sm font-bold shadow-[0_4px_16px_rgba(26,67,50,0.25)] hover:shadow-[0_6px_20px_rgba(26,67,50,0.35)] transition-all flex items-center justify-center gap-2 cursor-pointer active:scale-[0.99]"
        >
          <svg class="w-4 h-4 stroke-current" fill="none" stroke-width="2" viewBox="0 0 24 24">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
            <polyline points="10 17 15 12 10 7"></polyline>
            <line x1="15" y1="12" x2="3" y2="12"></line>
          </svg>
          <span>تسجيل الدخول إلى النظام</span>
        </button>
      </div>

      <!-- System Security Notice -->
      <div class="pt-3 text-center border-t border-slate-200/60 mt-4">
        <p class="text-[11px] font-medium text-slate-400 flex items-center justify-center gap-1.5">
          <svg class="w-3.5 h-3.5 text-emerald-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <span>نظام مشفّر محلياً • قاعدة بيانات SQLite المؤمنة</span>
        </p>
      </div>
    </form>

  </main>

  <script src="login.js"></script>
</body>
</html>
